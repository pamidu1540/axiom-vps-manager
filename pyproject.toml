[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-vps-manager"
version = "1.0.0"
description = "Modern, Secure, High-Performance VPS Tunneling & Management Platform"
readme = "README.md"
authors = [{ name = "Axiom VPS Manager Contributors" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.8.0",
    "python-telegram-bot>=22.8",
    "pydantic>=2.8.0",
    "qrcode>=7.4.2",
]

[project.scripts]
axiom = "axiom.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
